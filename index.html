<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1">
    <title>Satara Spatial Intelligence Dashboard</title>
    
    <!-- External Libraries (Using CDNs to fix the blank map issue) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(20, 25, 35, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #4DA8DA;
            --text-main: #E0E6ED;
            --text-muted: #8B9BB4;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Top Header */
        header {
            position: absolute; top: 0; left: 0; right: 0; height: 60px;
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000; box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .header-title { font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .header-title i { color: var(--accent); }
        .header-status { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .pulse { width: 8px; height: 8px; background: #22C55E; border-radius: 50%; box-shadow: 0 0 10px #22C55E; }

        /* App Layout */
        .app-container { display: flex; height: calc(100vh - 60px); margin-top: 60px; }

        /* Sidebar */
        .sidebar {
            width: 320px; background: var(--glass-bg); backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border); padding: 20px;
            overflow-y: auto; z-index: 999; transition: transform 0.3s ease;
        }

        .category-group { margin-bottom: 25px; }
        .category-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 15px; letter-spacing: 1px; border-bottom: 1px solid var(--glass-border); padding-bottom: 5px; }
        
        .layer-item { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .layer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .layer-name { font-size: 0.95rem; font-weight: 400; }
        
        /* Custom Toggle */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Opacity Slider */
        .opacity-slider { width: 100%; margin-top: 5px; cursor: pointer; accent-color: var(--accent); }

        /* Map Area */
        #map { flex-grow: 1; height: 100%; z-index: 1; background: #0F172A; }

        /* Attribute Inspector Card */
        .attribute-panel {
            position: absolute; right: -400px; top: 80px; width: 350px; max-height: calc(100vh - 120px);
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            box-shadow: -5px 5px 30px rgba(0,0,0,0.5); z-index: 1000;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column;
        }
        .attribute-panel.active { right: 20px; }
        
        .panel-header { padding: 15px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); border-radius: 12px 12px 0 0; }
        .panel-title { font-weight: 600; font-size: 1.1rem; }
        .close-btn { cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .close-btn:hover { color: #FF5A5A; }
        
        .panel-content { padding: 15px; overflow-y: auto; }
        .attr-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .attr-row { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; border-left: 3px solid var(--accent); }
        .attr-key { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .attr-value { font-size: 0.95rem; font-weight: 500; word-break: break-all; }

        /* Custom Leaflet Controls */
        .leaflet-control-zoom a { background: var(--glass-bg) !important; color: var(--text-main) !important; border: 1px solid var(--glass-border) !important; backdrop-filter: blur(4px); }
        .leaflet-control-zoom a:hover { background: var(--accent) !important; }
        .leaflet-control-attribution { background: rgba(0,0,0,0.5) !important; color: #8B9BB4 !important; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; left: -320px; height: 100%; }
            .sidebar.active { left: 0; }
            .attribute-panel { width: 90%; right: -100%; }
            .attribute-panel.active { right: 5%; }
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <div class="header-title">
            <i class="fas fa-satellite"></i>
            Satara Spatial Intelligence Dashboard
        </div>
        <div class="header-status">
            <div class="pulse"></div> Live Connected
        </div>
    </header>

    <div class="app-container">
        <!-- Collapsible Sidebar -->
        <div class="sidebar" id="sidebar">
            
            <div class="category-group">
                <div class="category-title"><i class="fas fa-map-marked-alt"></i> Boundaries</div>
                <div class="layer-item">
                    <div class="layer-header">
                        <span class="layer-name">Satara District Border</span>
                        <label class="switch"><input type="checkbox" id="toggle-satara" checked><span class="slider"></span></label>
                    </div>
                    <input type="range" class="opacity-slider" id="op-satara" min="0" max="1" step="0.1" value="1">
                </div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-leaf"></i> Environment</div>
                <div class="layer-item">
                    <div class="layer-header">
                        <span class="layer-name">Land Use</span>
                        <label class="switch"><input type="checkbox" id="toggle-landuse" checked><span class="slider"></span></label>
                    </div>
                    <input type="range" class="opacity-slider" id="op-landuse" min="0" max="1" step="0.1" value="1">
                </div>
                <div class="layer-item">
                    <div class="layer-header">
                        <span class="layer-name">Water Bodies</span>
                        <label class="switch"><input type="checkbox" id="toggle-water" checked><span class="slider"></span></label>
                    </div>
                    <input type="range" class="opacity-slider" id="op-water" min="0" max="1" step="0.1" value="1">
                </div>
                <div class="layer-item">
                    <div class="layer-header">
                        <span class="layer-name">Waterways</span>
                        <label class="switch"><input type="checkbox" id="toggle-waterways" checked><span class="slider"></span></label>
                    </div>
                    <input type="range" class="opacity-slider" id="op-waterways" min="0" max="1" step="0.1" value="1">
                </div>
            </div>

            <div class="category-group">
                <div class="category-title"><i class="fas fa-city"></i> Infrastructure</div>
                <div class="layer-item">
                    <div class="layer-header">
                        <span class="layer-name">Road Network</span>
                        <label class="switch"><input type="checkbox" id="toggle-road" checked><span class="slider"></span></label>
                    </div>
                    <input type="range" class="opacity-slider" id="op-road" min="0" max="1" step="0.1" value="1">
                </div>
                <div class="layer-item">
                    <div class="layer-header">
                        <span class="layer-name">Railway Lines</span>
                        <label class="switch"><input type="checkbox" id="toggle-railway" checked><span class="slider"></span></label>
                    </div>
                    <input type="range" class="opacity-slider" id="op-railway" min="0" max="1" step="0.1" value="1">
                </div>
                <div class="layer-item">
                    <div class="layer-header">
                        <span class="layer-name">Buildings</span>
                        <label class="switch"><input type="checkbox" id="toggle-building" checked><span class="slider"></span></label>
                    </div>
                    <input type="range" class="opacity-slider" id="op-building" min="0" max="1" step="0.1" value="1">
                </div>
            </div>
            
            <div class="category-group">
                <div class="category-title"><i class="fas fa-layer-group"></i> Basemap</div>
                <select id="basemap-selector" style="width:100%; padding: 8px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--glass-border); border-radius: 5px;">
                    <option value="satellite">Google Satellite</option>
                    <option value="terrain">Google Terrain</option>
                </select>
            </div>
        </div>

        <!-- Map Canvas -->
        <div id="map"></div>

        <!-- Dynamic Attribute Inspector -->
        <div class="attribute-panel" id="attr-panel">
            <div class="panel-header">
                <div class="panel-title" id="attr-title"><i class="fas fa-info-circle"></i> Feature Details</div>
                <i class="fas fa-times close-btn" onclick="closeAttributePanel()"></i>
            </div>
            <div class="panel-content">
                <div class="attr-grid" id="attr-grid">
                    <!-- Dynamic content loads here -->
                    <div class="attr-row"><div class="attr-key">Select a feature</div><div class="attr-value">Click any map element to view data.</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS from CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Data Scripts (Make sure your /data folder is uploaded correctly to GitHub) -->
    <script src="data/satara_b_2.js"></script>
    <script src="data/landuse_3.js"></script>
    <script src="data/building_4.js"></script>
    <script src="data/wateways_5.js"></script>
    <script src="data/water_6.js"></script>
    <script src="data/railway_7.js"></script>
    <script src="data/road_8.js"></script>

    <script>
        // 1. Initialize Map
        var map = L.map('map', {
            zoomControl: true, maxZoom: 28, minZoom: 1
        }).fitBounds([[16.493,72.427],[18.359,76.093]]);
        
        map.zoomControl.setPosition('bottomleft');

        // Force Leaflet to recalculate size after loading (Fix for blank map in flexbox containers)
        setTimeout(function(){ map.invalidateSize(); }, 500);

        // 2. Basemaps
        var basemapSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 28 }).addTo(map);
        var basemapTerrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', { maxZoom: 28 });

        document.getElementById('basemap-selector').addEventListener('change', function(e) {
            if(e.target.value === 'terrain') { map.removeLayer(basemapSatellite); map.addLayer(basemapTerrain); }
            else { map.removeLayer(basemapTerrain); map.addLayer(basemapSatellite); }
        });

        // 3. Dynamic Attribute Inspector Function
        function openAttributePanel(feature, layerName) {
            document.getElementById('attr-panel').classList.add('active');
            document.getElementById('attr-title').innerHTML = `<i class="fas fa-layer-group"></i> ${layerName}`;
            
            const grid = document.getElementById('attr-grid');
            grid.innerHTML = ''; 

            let hasProps = false;
            for (const [key, value] of Object.entries(feature.properties)) {
                if (value !== null && value !== '') {
                    hasProps = true;
                    grid.innerHTML += `
                        <div class="attr-row">
                            <div class="attr-key">${key.replace(/_/g, ' ')}</div>
                            <div class="attr-value">${value}</div>
                        </div>`;
                }
            }
            if(!hasProps) {
                grid.innerHTML = `<div class="attr-row"><div class="attr-value">No attributes available for this feature.</div></div>`;
            }
        }
        function closeAttributePanel() { document.getElementById('attr-panel').classList.remove('active'); }

        // 4. Styling Definitions
        const styles = {
            satara: { color: 'rgba(255, 255, 255, 0.8)', weight: 2, fillOpacity: 0.1, fillColor: '#ffffff' },
            landuse: { color: 'transparent', weight: 0, fillOpacity: 0.6, fillColor: '#2E8B57' },
            water: { color: 'transparent', weight: 0, fillOpacity: 0.7, fillColor: '#4DA8DA' },
            waterways: { color: '#4DA8DA', weight: 2, fillOpacity: 0 },
            road: { color: '#FF5A5A', weight: 1.5, fillOpacity: 0 },
            railway: { color: '#F39C12', weight: 2, dashArray: '4, 4', fillOpacity: 0 },
            building: { color: '#C45317', weight: 1, fillOpacity: 0.8, fillColor: '#E67E22' }
        };

        // 5. Layer Initialization Generator
        function loadCustomLayer(geojsonData, styleDef, name) {
            return L.geoJson(geojsonData, {
                style: function() { return styleDef; },
                onEachFeature: function(feature, layer) {
                    layer.on('click', function(e) {
                        L.DomEvent.stopPropagation(e); // Prevent map click from firing
                        openAttributePanel(feature, name);
                    });
                }
            });
        }

        // Add Layers (Checks if data files loaded successfully to prevent console errors)
        const layers = {};
        if(typeof json_satara_b_2 !== 'undefined') layers.satara = loadCustomLayer(json_satara_b_2, styles.satara, 'Satara Boundary').addTo(map);
        if(typeof json_landuse_3 !== 'undefined') layers.landuse = loadCustomLayer(json_landuse_3, styles.landuse, 'Land Use').addTo(map);
        if(typeof json_water_6 !== 'undefined') layers.water = loadCustomLayer(json_water_6, styles.water, 'Water Body').addTo(map);
        if(typeof json_wateways_5 !== 'undefined') layers.waterways = loadCustomLayer(json_wateways_5, styles.waterways, 'Waterway').addTo(map);
        if(typeof json_road_8 !== 'undefined') layers.road = loadCustomLayer(json_road_8, styles.road, 'Road Network').addTo(map);
        if(typeof json_railway_7 !== 'undefined') layers.railway = loadCustomLayer(json_railway_7, styles.railway, 'Railway Line').addTo(map);
        if(typeof json_building_4 !== 'undefined') layers.building = loadCustomLayer(json_building_4, styles.building, 'Building').addTo(map);

        // Map click closes panel
        map.on('click', closeAttributePanel);

        // 6. UI Controls Binding (Toggles & Opacity)
        Object.keys(layers).forEach(key => {
            // Toggles
            const toggle = document.getElementById(`toggle-${key}`);
            if(toggle) {
                toggle.addEventListener('change', (e) => {
                    e.target.checked ? map.addLayer(layers[key]) : map.removeLayer(layers[key]);
                });
            }
            // Opacity Sliders
            const slider = document.getElementById(`op-${key}`);
            if(slider) {
                slider.addEventListener('input', (e) => {
                    let val = parseFloat(e.target.value);
                    layers[key].eachLayer(layer => {
                        if (layer.setStyle) {
                            let defaultStyle = styles[key];
                            layer.setStyle({ 
                                opacity: val, 
                                fillOpacity: defaultStyle.fillOpacity > 0 ? (val * defaultStyle.fillOpacity) : 0 
                            });
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
